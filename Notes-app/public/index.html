<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Notes App</h1>
        
        <form id="note-form">
            <input type="hidden" id="note-id">
            <input type="text" id="note-title" placeholder="Note Title" required>
            <textarea id="note-content" rows="4" placeholder="Write your note here..." required></textarea>
            <div class="form-actions">
                <button type="submit" id="submit-btn">Add Note</button>
                <button type="button" id="cancel-btn" class="hidden">Cancel</button>
            </div>
        </form>

        <div id="notes-list" class="notes-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
